[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openevent-modules-cmd"
version = "0.1.0"
description = "OpenEvent cmd.v1 protocol SDK and command worker"
requires-python = ">=3.10"
dependencies = [
    "openevent-sdk>=0.3.0",
    "PyYAML>=6.0",
]

[project.scripts]
cmd-worker = "openevent.cmd_worker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openevent"]
